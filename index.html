<style>
:root{--sage:#71836b;--dark:#394b38;--muted:#78836f;--cream:#f4f1e8;--paper:#fffefa;--line:#e3e2d8;--peach:#eee4d9}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:22px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand small{letter-spacing:.12em;color:var(--muted);font-weight:700;font-size:0.625rem}.brand h1{font-family:Georgia,serif;font-size:1.6875rem;margin:3px 0}.brand p{margin:0;color:var(--muted);font-size:0.75rem}header img{width:66px;height:66px;border-radius:18px;object-fit:cover}
main{max-width:720px;margin:auto;padding:0 14px 30px}.hero{background:#e2e7d9;border-radius:18px;padding:17px;margin-bottom:14px}.hero h2{margin:0 0 5px;font: bold 1.3125rem Georgia}.hero p{margin:0 0 13px;color:#687763;font-size:0.8125rem}.stats{display:flex;justify-content:space-between;gap:8px}.stat strong{display:block;font-size:1.375rem}.stat span{font-size:0.6875rem;color:#687763}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.navbtn{border:0;border-radius:12px;background:var(--paper);padding:10px 3px;color:#61745a;font-size:0.6875rem;font-weight:650}.navbtn.active{background:var(--sage);color:white}.navbtn span{display:block;font-size:1.125rem;margin-bottom:3px}
.panel{background:var(--paper);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #514b3510}.panel h2{font: bold 1.25rem Georgia;margin:0 0 13px}.muted{color:var(--muted);font-size:0.75rem}.row{display:flex;align-items:center;gap:9px}.row>*:first-child{flex:1}
input,textarea,select{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;color:var(--dark);width:100%;min-width:0}textarea{min-height:150px;resize:vertical}
button{font:inherit;cursor:pointer}.add{border:0;background:var(--sage);color:white;border-radius:10px;padding:11px 14px;font-weight:650}.secondary{border:0;background:#e7ebdf;color:var(--dark);border-radius:10px;padding:10px 12px;font-weight:650}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--sage)}.item .name{flex:1;font-size:0.875rem}.item.done .name{text-decoration:line-through;color:#969b8e}.delete{border:0;background:transparent;color:#9b8275;font-size:1.125rem;padding:4px 7px}
.progress{height:8px;border-radius:20px;background:#dfe4d8;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--sage);width:0}
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#f0eee5;border-radius:13px;padding:13px}.mini b{display:block;margin-bottom:5px}.mini p{margin:0;color:var(--muted);font-size:0.75rem}
.day{border-top:1px solid var(--line);padding:11px 0}.day strong{display:block;margin-bottom:6px}.tag{display:inline-block;background:#e8ecdf;border-radius:20px;padding:5px 9px;font-size:0.75rem;margin:3px}

@media(min-width:600px){nav{grid-template-columns:repeat(6,1fr)}}

:root{--sage:#315747;--dark:#202b26;--muted:#586761;--cream:#f5f6f2;--paper:#fff;--line:#e0e7e0}
main{max-width:760px;padding:4px 16px calc(105px + env(safe-area-inset-bottom))}
#view>h2{font-size:2rem;letter-spacing:-.045em;margin:18px 4px}
.panel{border:1px solid var(--line);border-radius:16px;box-shadow:none;margin:12px 0;padding:17px}
.panel h2{font:600 1.0625rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.02em}

.tag{background:#edf2ec}.add,.secondary{min-height:44px}.secondary{background:#edf2ec}

form:not(.row){display:grid;gap:9px}input,textarea,select{font-size:1rem}

input,textarea,select{background:var(--paper)}

[data-aesthetic="garden"]{color-scheme:light;--sage:#345641;--dark:#23382b;--muted:#4d6554;--cream:#f7f6eb;--paper:#fffef7;--line:#d9e2d2;--soft:#eef3e8;--selected:#dce9d8;--sticker:#e1ebda;--accent:#90a980}
[data-aesthetic="cherry"]{color-scheme:light;--sage:#912741;--dark:#4b2630;--muted:#73505b;--cream:#fff6f2;--paper:#fffdf8;--line:#efdadb;--soft:#fae9eb;--selected:#f5d7df;--sticker:#fae3e8;--accent:#cf7990}
[data-aesthetic="midnight"]{color-scheme:dark;--sage:#765cb0;--dark:#f7f2ff;--muted:#cec2df;--cream:#18182b;--paper:#25253e;--line:#49425f;--soft:#35324f;--selected:#50456f;--sticker:#3b345a;--accent:#ac91d3}
[data-aesthetic="midnight"] .delete{color:#f0aeba}
[data-aesthetic="midnight"] .item.done .name{color:var(--muted)}
[data-aesthetic="cherry"] .welcome-note,[data-aesthetic="cherry"] .theme-sticker{background-image:repeating-linear-gradient(90deg,transparent 0 12px,#b72d5712 12px 24px),repeating-linear-gradient(0deg,transparent 0 12px,#b72d5712 12px 24px)}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.theme-choice{display:grid;gap:8px;padding:11px;text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--cream);color:var(--dark)}

.theme-sticker{display:block;padding:7px;border-radius:7px;background:var(--sticker);font:italic 1rem Georgia,serif}

.theme-action{justify-self:start;background:var(--sage);color:#fff;border-radius:6px;padding:3px 7px;font-size:0.8125rem}

.welcome-identity{display:flex;align-items:center;gap:10px;min-width:0}
.profile-avatar{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:var(--paper);border:1px solid var(--line);object-fit:cover;color:var(--dark);font-weight:700}
.profile-options{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.profile-options button[aria-pressed="true"]{outline:2px solid var(--sage);outline-offset:1px}
.profile-actions{margin-top:14px}
.welcome-note .welcome-mood{font:600 0.875rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration:none;grid-column:1/-1;text-align:left}
.directory-row{display:flex;align-items:stretch;gap:8px;padding:5px 0}
.directory-row+.directory-row{border-top:1px solid var(--line)}
.directory-link{display:flex;align-items:center;gap:10px;flex:1;padding:8px;border:0;background:transparent;color:var(--dark);text-align:left;min-height:48px}
.directory-icon{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:9px;background:var(--soft)}
.pin-tool{flex:none;width:48px;border:0;border-radius:9px;background:var(--soft);color:var(--dark);font-size:1.375rem}
.pin-tool[aria-pressed="true"]{background:var(--selected)}
.next-appointment{width:100%;margin-top:12px}
.meal-week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(40px,1fr));gap:4px;margin:12px 0}
.meal-days button{padding:4px;font-size:0.875rem}
.meal-days button[aria-pressed="true"]{background:var(--sage);color:#fff}
.meal-recipe{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:10px}
.meal-recipe summary{cursor:pointer;font-weight:650}
.meal-actions{display:flex;flex-wrap:wrap;gap:8px}
.daily-affirmation{margin:12px 0 18px;padding:10px 13px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 9px 9px 0}
.daily-affirmation h3{margin:0;font-size:0.875rem}
.daily-affirmation p{margin:3px 0 0;font:italic 1.0625rem/1.4 Georgia,serif}
.task-reminder{padding:0 0 10px;margin-bottom:8px}
.task-reminder summary{cursor:pointer;color:var(--muted);font-size:0.875rem;padding:8px 0}
.task-reminder button{justify-self:start}
.reminder-list{margin:0;padding-left:20px}
.reminder-list li+li{margin-top:5px}
.ingredient-choice{display:flex;gap:10px;align-items:center;min-height:44px}
.ingredient-choice input{width:20px;height:20px;flex:none;accent-color:var(--sage)}
.ingredient-choice span{overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
.recipe-source-list{display:grid;gap:6px;margin:10px 0}
.recipe-source-list a,.saved-recipe-link{color:var(--dark);display:block;padding:10px 0;text-underline-offset:3px;overflow-wrap:anywhere}
.recipe-source-list .item{overflow-wrap:anywhere}

:root{--title-font:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;--planner-font:system-ui,sans-serif;--preview-size:16px}
[data-title-font="serif"]{--title-font:Georgia,serif}
[data-title-font="clean"]{--title-font:system-ui,sans-serif}
[data-planner-font="rounded"]{--planner-font:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}

[data-text-size="large"]{--preview-size:18px}
[data-text-size="extra"]{--preview-size:20px}
html[data-text-size="large"]{font-size:112.5%}

.typography-preview p{margin:6px 0}

.weather-summary button{max-width:100%;overflow-wrap:anywhere}

<body>
<header class="app-header"><h1>The Little Things</h1></header>
<main><div id="view"></div></main>
<nav id="nav" aria-label="Main navigation"></nav>
<script>
const sections=[["Home","⌂"],["Calendar","▦"],["Tasks","☷"],["Money","$"],["Pets","🐾"],["Shopping","🛒"],["Groceries","🥕"],["Wishlist","♡"],["Projects","✂"],["Routines","☀"],["Notes","✎"],["Appointments","🗓"],["Circles","◎"]];
const defaults={tasks:[{id:1,name:"Review weekly schedule",done:false},{id:2,name:"Laundry",done:false},{id:3,name:"Work on crochet project",done:false},{id:4,name:"Pet care",done:true}],events:[{id:1,name:"Weekly reset",day:"Monday"},{id:2,name:"Laundry",day:"Wednesday"},{id:3,name:"Plan next week",day:"Sunday"}],appointments:[],groceries:[],wishlist:[],bills:[{id:1,name:"Rent",amount:800,paid:false},{id:2,name:"Car payment",amount:300,paid:false},{id:3,name:"Internet",amount:60,paid:false}],budget:2000,expenses:[],pets:[false,false,false,false],shopping:["Milk","Eggs","Cat food","Laundry detergent"],projects:[{id:1,name:"Omega sweater",progress:45},{id:2,name:"Baby blanket",progress:70},{id:3,name:"Craft project",progress:10}],routines:[false,false,false,false],notes:"",
circles:[
{id:1,name:"Our Household",members:["You","Household member"],shared:["tasks","calendar","pets","shopping"],activity:["You created Our Household."]},
{id:2,name:"Family",members:["You","Family member"],shared:["calendar","events"],activity:["You created the Family circle."]}
],
activeCircle:1
};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem("littleThingsData")||"{}")}}catch(e){data=structuredClone(defaults)}
const aesthetics = [
 ["diary", "Lavender Diary"],
 ["garden", "Sunday Garden"],
 ["cherry", "Cherry Gingham"],
 ["midnight", "Midnight Ink"]
];
const aestheticKey = "littleThingsAesthetic";
let savedAesthetic;
try { savedAesthetic = localStorage.getItem(aestheticKey); } catch {}
let aesthetic = aesthetics.some(([id]) => id === savedAesthetic) ? savedAesthetic : "diary";
let choosingFirstTheme = !savedAesthetic;
let section = choosingFirstTheme ? "Appearance" : "Home";
let choosingFirstPicture = false;
const moodKey = "littleThingsMood";
const moods = [["happy","😊","Happy"],["calm","😌","Calm"],["tired","😴","Tired"],["stressed","😟","Stressed"],["down","😔","Down"]];
let mood = "";
try { mood = localStorage.getItem(moodKey) || ""; } catch {}

const profileKey = "littleThingsProfilePicture";
const avatars = { flower: ["🌼", "Flower"], cat: ["🐱", "Cat"], moon: ["🌙", "Moon"], berry: ["🍓", "Strawberry"] };
let profilePicture = "";
try { profilePicture = localStorage.getItem(profileKey) || ""; } catch {}

function profileAvatar() {
 if (/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(profilePicture)) {
  return `<img class="profile-avatar" src="${profilePicture}" alt="">`;
 }
 const initial = Array.from((data.displayName || "").trim())[0]?.toUpperCase() || "☺";
 const symbol = Object.hasOwn(avatars, profilePicture) ? avatars[profilePicture][0] : initial;
 return `<span class="profile-avatar" aria-hidden="true">${esc(symbol)}</span>`;
}

function finishProfileSetup() {
 choosingFirstPicture = false;
 section = "Home";
 render();
}

function setProfilePicture(picture) {
 localStorage.setItem(profileKey, picture);
 profilePicture = picture;
 render();
}

async function importProfilePicture(file) {
 const url = URL.createObjectURL(file);
 try {
  const image = new Image();
  image.src = url;
  await image.decode();
  const crop = Math.min(image.naturalWidth, image.naturalHeight);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 192;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, 192, 192);
  ctx.drawImage(image, (image.naturalWidth - crop) / 2, (image.naturalHeight - crop) / 2,
   crop, crop, 0, 0, 192, 192);
  setProfilePicture(canvas.toDataURL("image/jpeg", 0.82));
 } finally {
  URL.revokeObjectURL(url);
 }
}

function applyAesthetic() {
 document.documentElement.dataset.aesthetic = aesthetic;
 const background = getComputedStyle(document.documentElement).getPropertyValue("--cream").trim();
 document.querySelector('meta[name="theme-color"]').content = background;
}

function chooseAesthetic(id) {
 aesthetic = id;
 try { localStorage.setItem(aestheticKey, id); } catch {}
 applyAesthetic();
 if (choosingFirstTheme) {
  choosingFirstPicture = true;
  section = "Profile";
 }
 choosingFirstTheme = false;
 render();
 if (section === "Appearance") document.querySelector('[data-set-aesthetic="' + id + '"]').focus();
}
function save(){localStorage.setItem("littleThingsData",JSON.stringify(data));stats()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stats() {
 const count = document.getElementById("taskStat");
 if (count) count.textContent = data.tasks.filter(task => task.done).length + " of " + data.tasks.length;
}
const planning = [
 ["Calendar", "Weekly calendar"], ["Appointments", "Appointments"], ["Tasks", "Tasks"], ["Meals", "Meal planning"], ["Occasions", "Birthdays & events"]
];
const toolGroups = [
 ["Everyday", [["Weather", "Weather & outfits"], ["Groceries", "Groceries & essentials"], ["Shopping", "Shopping list"], ["Pets", "Pet care"]]],
 ["Money", [["Money", "Bills & budget"], ["Wishlist", "Wishlist"]]],
 ["Wellness", [["Mood", "Mood"], ["Routines", "Daily routines"]]],
 ["Creative & personal", [["Projects", "Creative projects"], ["Notes", "Notes"]]],
 ["Settings", [["Profile", "Profile"], ["Appearance", "Appearance"]]]
];
const toolLinks = toolGroups.flatMap(([, links]) => links);
const toolIcons = new Map([...sections, ["Mood", "☺"], ["Profile", "○"], ["Appearance", "✦"], ["Meals", "♨"], ["Occasions", "🎂"], ["Weather", "☀"]]);
const pinnedToolsKey = "littleThingsPinnedTools";
let pinnedTools = [];
try {
 const savedPins = JSON.parse(localStorage.getItem(pinnedToolsKey) || "[]");
 if (Array.isArray(savedPins)) pinnedTools = [...new Set(savedPins)].filter(id => toolLinks.some(([page]) => page === id));
} catch {}

function directoryRows(links, showPins = false) {
 return links.map(([page, label]) => {
  const pinned = pinnedTools.includes(page);
  return `<div class="directory-row"><button class="directory-link" data-go="${page}"><span class="directory-icon" aria-hidden="true">${toolIcons.get(page)}</span>${label}</button>`
   + (showPins ? `<button class="pin-tool" data-pin-tool="${page}" aria-label="${esc(label)} favorite" aria-pressed="${pinned}">${pinned ? "★" : "☆"}</button>` : "")
   + "</div>";
 }).join("");
}

function nav() {
 const tabs = [["Home", "⌂"], ["Plan", "▦"], ["Circles", "◎"], ["Tools", "⋯"]];
 const active = section === "Plan" || planning.some(([page]) => page === section)
  ? "Plan" : ["Home", "Circles"].includes(section) ? section : "Tools";
 const navigation = document.getElementById("nav");
 navigation.hidden = choosingFirstTheme || choosingFirstPicture;
 navigation.innerHTML = tabs.map(([name, icon]) => `<button class="navbtn ${active === name ? "active" : ""}" data-section="${name}" ${active === name ? 'aria-current="page"' : ""}><span aria-hidden="true">${icon}</span>${name}</button>`).join("");
 navigation.querySelectorAll("[data-section]").forEach(button => {
  button.onclick = () => { section = button.dataset.section; render(); window.scrollTo(0, 0); };
 });
}
function checkList(items,kind){return items.map((x,i)=>`<div class="item ${x.done?"done":""}"><input type="checkbox" data-check="${kind}" data-id="${x.id}" ${x.done?"checked":""}><span class="name">${esc(x.name)}</span><button class="delete" data-del="${kind}" data-id="${x.id}">×</button></div>`).join("")}
function addForm(placeholder,kind){return `<form class="row" data-add="${kind}"><input name="name" placeholder="${placeholder}" required><button class="add">Add</button></form>`}
function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function moodPanel() {
 return panel("Mood",
   '<p class="muted">Your mood is saved on this device.</p><div class="profile-options">'
   + moods.map(([id, icon, label]) => `<button class="secondary" data-mood="${id}" aria-pressed="${mood === id}"><span aria-hidden="true">${icon}</span> ${label}</button>`).join("")
   + (mood ? '<button class="secondary" data-mood="">Clear mood</button>' : '')
   + '</div><p id="moodError" role="status" class="muted"></p>');
}
const dinnerRecipes = [

function recipeWebUrl(input, allowBareHost = false) {
 const value = input.trim();
 if (!value || /[\u0000-\u0020\u007f]/.test(value)) return null;
 try {
  const url = new URL(allowBareHost && !value.includes("://") ? "https://" + value : value);
  const ordinaryDomain = /^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z][a-z0-9-]*$/i.test(url.hostname);
  if (!["https:", "http:"].includes(url.protocol) || !ordinaryDomain || url.username || url.password || url.port) return null;
  return url;
 } catch { return null; }
}

function occurrenceDate(occasion, year) {
 const [savedYear, month, day] = occasion.date.split("-").map(Number);
 const eventYear = occasion.yearly ? year : savedYear;
 const lastDay = new Date(eventYear, month, 0).getDate();
 return new Date(eventYear, month - 1, Math.min(day, lastDay));
}

function refreshDueReminders(now = new Date()) {
 const region = document.getElementById("dueReminders");
 if (!region) return;
 const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
 const dueTasks = data.tasks.filter(task => !task.done && task.remindAt && new Date(task.remindAt) <= now);
 const dueOccasions = occasions.flatMap(occasion => {
  const date = occurrenceDate(occasion, today.getFullYear());
  const next = occasion.yearly && date < today ? occurrenceDate(occasion, today.getFullYear() + 1) : date;
  const from = new Date(next);
  from.setDate(from.getDate() - occasion.lead);
  return from <= today && next >= today
   ? [occasion.name + " · " + next.toLocaleDateString(undefined, {month:"short", day:"numeric"})] : [];
 });
 const reminders = [...dueTasks.map(task => task.name), ...dueOccasions];
 const content = reminders.length
  ? panel("Reminders", '<ul class="reminder-list">' + reminders.map(text => '<li>' + esc(text) + '</li>').join("") + '</ul>')
  : "";
 if (region.innerHTML !== content) region.innerHTML = content;
}

function cityName(city) {
 return [city.name, city.admin1, city.country].filter(Boolean).join(", ");
}

async function weatherJson(url) {
 const response = await fetch(url, {signal: AbortSignal.timeout(10000)});
 if (!response.ok) throw new Error("Weather service unavailable");
 return response.json();
}

function weatherDescription(code) {
 if (code === 0) return "Clear";
 if (code <= 3) return "Cloudy";
 if (code <= 48) return "Fog";
 if (code >= 95) return "Thunderstorms";
 if ([71,73,75,77,85,86].includes(code)) return "Snow";
 return "Rain or drizzle";
}

function outfitSuggestion({apparent_temperature: feels, weather_code: code, wind_speed_10m: wind}) {
 const layers = feels >= 85 ? "Breathable top, shorts or a light skirt, and comfortable shoes."
  : feels >= 72 ? "A light tee or blouse with shorts, a skirt, or airy pants."
  : feels >= 60 ? "A tee with jeans or trousers and a light cardigan."
  : feels >= 45 ? "A sweater, long pants, and a light jacket."
  : "A warm coat over layers, long pants, and warm shoes.";
 const extras = [];
 if ([71,73,75,77,85,86].includes(code)) extras.push("Add warm, water-resistant boots.");
 else if (code >= 51) extras.push("Bring a rain jacket and water-resistant shoes.");
 else if (wind >= 18) extras.push("Consider a wind-resistant layer.");
 return [layers, ...extras].join(" ");
}

  ? weatherDescription(conditions.weather_code) + " · " + Math.round(conditions.temperature_2m) + "°F"
   + " · Feels like " + Math.round(conditions.apparent_temperature) + "°F"
  : weatherError || (weatherCity ? "Loading weather…" : "Choose a city for weather");
 const outfit = document.getElementById("weatherOutfit");
 if (outfit) outfit.textContent = conditions ? outfitSuggestion(conditions) : "";
 const clock = document.getElementById("dailyClock");
 if (clock) {
  const options = {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"};
  if (weatherCity?.timezone) options.timeZone = weatherCity.timezone;
  try { clock.textContent = new Date().toLocaleString(undefined, options); }

 }

async function refreshWeather() {
 refreshWeatherUI();
 if (!weatherCity || weatherLoading || Date.now() - weatherUpdated < 600000) return;
 weatherLoading = true;
 const revision = weatherCityRevision;
 const url = new URL("https://api.open-meteo.com/v1/forecast");
 url.search = new URLSearchParams({latitude:weatherCity.latitude, longitude:weatherCity.longitude,
  current:"temperature_2m,apparent_temperature,weather_code,wind_speed_10m", temperature_unit:"fahrenheit", wind_speed_unit:"mph"});
 try {
  const result = await weatherJson(url);
  if (revision === weatherCityRevision) {
   if (!["temperature_2m","apparent_temperature","weather_code","wind_speed_10m"].every(key => Number.isFinite(result.current?.[key]))) throw new Error("Incomplete forecast");
   conditions = result.current;
   weatherError = "";
  }
 } catch {
  if (revision === weatherCityRevision) { conditions = null; weatherError = "Weather is unavailable right now."; }
 } finally {
  weatherLoading = false;
  if (revision === weatherCityRevision) {
   weatherUpdated = Date.now();
   refreshWeatherUI();
  } else if (weatherCity) refreshWeather();
 }
}

function bindWeather() {
 const form = document.getElementById("weatherCityForm");
 if (!form) return;
 const resultList = document.getElementById("weatherCityResults");
 const status = document.getElementById("weatherCityStatus");
 function changeCity(city) {
  try {
   if (city) localStorage.setItem(weatherCityKey, JSON.stringify(city));
   else localStorage.removeItem(weatherCityKey);
  } catch { status.textContent = "Could not save your city on this device."; return; }
  weatherCity = city;
  conditions = null;
  weatherError = "";
  weatherUpdated = 0;
  weatherCityRevision++;
  render();
 }
 const remove = document.getElementById("removeWeatherCity");
 if (remove) remove.onclick = () => changeCity(null);
 form.onsubmit = async event => {
  event.preventDefault();
  const name = form.elements.city.value.trim();
  if (name.length < 2) { status.textContent = "Enter at least two letters."; return; }
  const button = form.querySelector("button");
  button.disabled = true;
  resultList.innerHTML = "";
  status.textContent = "Searching…";
  const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
  url.search = new URLSearchParams({name, count:"6", language:"en"});
  try {
   const {results = []} = await weatherJson(url);
   if (!form.isConnected) return;
   status.textContent = results.length ? "Select your city." : "No matching city found.";
   results.forEach(city => {
    const option = document.createElement("button");
    option.className = "secondary";
    option.textContent = cityName(city);
    option.onclick = () => changeCity(city);
    resultList.append(option);
   });
  } catch { status.textContent = "City search is unavailable right now."; }
  finally { button.disabled = false; }
 };
}

function bind(){
let wf=document.getElementById("wishForm");if(wf)wf.onsubmit=async e=>{e.preventDefault();let f=new FormData(wf),name=f.get('name').trim(),btn=wf.querySelector('button');if(!name)return;btn.disabled=true;try{let photo='',file=f.get('photo');if(file&&file.size){let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas'),scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',0.65)}finally{URL.revokeObjectURL(url)}}let item={id:Date.now(),name,photo,done:false};for(let k of ['brand','price','category','priority','link','notes'])item[k]=f.get(k).trim();data.wishlist.push(item);try{save()}catch(err){data.wishlist.pop();throw err}render()}catch(err){alert('Could not save item. Try a smaller photo or free device storage.');btn.disabled=false}};

let gf=document.getElementById("groceryForm");if(gf)gf.onsubmit=async e=>{e.preventDefault();let f=new FormData(gf),name=f.get("name").trim();if(!name)return;let btn=gf.querySelector('button');btn.disabled=true;let photo='';try{let file=f.get('photo');if(file&&file.size){let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let c=document.createElement('canvas'),scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',0.65)}finally{URL.revokeObjectURL(url)}}let item={id:Date.now(),name,qty:f.get('qty').trim(),brand:f.get('brand').trim(),description:f.get('description').trim(),category:f.get('custom').trim()||f.get('category'),photo,done:false};data.groceries.push(item);try{localStorage.setItem('littleThingsData',JSON.stringify(data))}catch(err){data.groceries.pop();throw new Error('Device storage is full. Try adding without a photo.')}render()}catch(err){alert(err.message||'Could not save item. Try another photo.');btn.disabled=false}};
let cg=document.getElementById("clearGroceries");if(cg)cg.onclick=()=>{data.groceries=data.groceries.filter(x=>!x.done);save();render()};
let cp=document.getElementById("copyGroceries");if(cp)cp.onclick=async()=>{let t=data.groceries.filter(x=>!x.done).map(x=>x.name+(x.qty?" — "+x.qty:"")).join("\n");try{await navigator.clipboard.writeText(t);alert("List copied")}catch(e){prompt("Copy your grocery list",t)}};


let af=document.getElementById("appointmentForm");if(af)af.onsubmit=e=>{
e.preventDefault();let f=new FormData(af);
data.appointments.push({id:Date.now(),name:f.get("name").trim(),type:f.get("type"),date:f.get("date"),time:f.get("time"),location:f.get("location").trim(),notes:f.get("notes").trim()});
save();render();
};
document.querySelectorAll("[data-appointment-del]").forEach(el=>el.onclick=()=>{
data.appointments=data.appointments.filter(a=>a.id!=el.dataset.appointmentDel);save();render();
});

let cf=document.getElementById("circleForm");if(cf)cf.onsubmit=e=>{e.preventDefault();let name=new FormData(cf).get("name").trim();if(name){data.circles.push({id:Date.now(),name,members:["You"],activity:["Circle created"]});save();render()}};
document.querySelectorAll("[data-invite]").forEach(f=>f.onsubmit=e=>{e.preventDefault();let c=data.circles.find(x=>x.id==f.dataset.invite);let member=new FormData(f).get("member").trim();if(c&&member){c.members.push(member);c.activity.push(member+" added to the circle");save();render()}});
document.querySelectorAll("[data-circle-del]").forEach(b=>b.onclick=()=>{if(confirm("Remove this circle from this device?")){data.circles=data.circles.filter(c=>c.id!=b.dataset.circleDel);save();render()}});
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{section=b.dataset.go;render();window.scrollTo(0,0)});
document.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{let x=data[el.dataset.check].find(x=>x.id==el.dataset.id);if(x){x.done=el.checked;if(x.done && el.dataset.check==="tasks") delete x.remindAt;}save();render()});
document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{data[el.dataset.del]=data[el.dataset.del].filter(x=>x.id!=el.dataset.id);save();render()});
document.querySelectorAll("form[data-add]").forEach(f=>f.onsubmit=e=>{e.preventDefault();let name=new FormData(f).get("name").trim();if(!name)return;let k=f.dataset.add;if(k==="shopping")data.shopping.push(name);else data[k].push({id:Date.now(),name,...(k==="events"?{day:document.getElementById("eventDay").value}:{done:false})});save();render()});
document.querySelectorAll("[data-bill]").forEach(el=>el.onchange=()=>{let b=data.bills.find(x=>x.id==el.dataset.bill);b.paid=el.checked;save()});
document.querySelectorAll("[data-pet]").forEach(el=>el.onchange=()=>{data.pets[+el.dataset.pet]=el.checked;save()});
document.querySelectorAll("[data-routine]").forEach(el=>el.onchange=()=>{data.routines[+el.dataset.routine]=el.checked;save()});
document.querySelectorAll("[data-shop]").forEach(el=>el.onclick=()=>{data.shopping.splice(+el.dataset.shop,1);save();render()});
let circleSelect=document.getElementById("circleSelect");if(circleSelect)circleSelect.onchange=()=>{data.activeCircle=+circleSelect.value;save();render()};
let newCircle=document.getElementById("newCircle");if(newCircle)newCircle.onclick=()=>{let name=prompt("Name your new circle");if(name&&name.trim()){let c={id:Date.now(),name:name.trim(),members:["You"],shared:[],activity:["You created this circle."]};data.circles.push(c);data.activeCircle=c.id;save();render()}};
document.querySelectorAll("[data-share]").forEach(el=>el.onchange=()=>{let c=data.circles.find(c=>c.id===data.activeCircle);let key=el.dataset.share;if(el.checked&&!c.shared.includes(key))c.shared.push(key);if(!el.checked)c.shared=c.shared.filter(x=>x!==key);c.activity.push(`You ${el.checked?"enabled":"disabled"} sharing for ${el.parentElement.querySelector(".name").textContent}.`);save();render()});
let invite=document.getElementById("inviteForm");if(invite)invite.onsubmit=e=>{e.preventDefault();let name=new FormData(invite).get("member").trim();if(!name)return;let c=data.circles.find(c=>c.id===data.activeCircle);c.members.push(name);c.activity.push(`You added ${name} to this circle (local demo).`);save();render()};
document.querySelectorAll("[data-project]").forEach(el=>el.oninput=()=>{let p=data.projects.find(x=>x.id==el.dataset.project);p.progress=+el.value;save();el.previousElementSibling.textContent=p.progress+"% complete"});
let budget=document.getElementById("budget");if(budget)budget.onchange=()=>{data.budget=+budget.value;save();render()};
let ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();data.expenses.push({amount:+new FormData(ef).get("amount")});save();render()};
let pf=document.getElementById("projectForm");if(pf)pf.onsubmit=e=>{e.preventDefault();data.projects.push({id:Date.now(),name:new FormData(pf).get("name"),progress:0});save();render()};
let n=document.getElementById("notes");if(n)n.oninput=()=>{data.notes=n.value;save()};
let rp=document.getElementById("resetPets");if(rp)rp.onclick=()=>{data.pets=[false,false,false,false];save();render()};
let rr=document.getElementById("resetRoutine");if(rr)rr.onclick=()=>{data.routines=[false,false,false,false];save();render()};
let cs=document.getElementById("copyShop");if(cs)cs.onclick=()=>navigator.clipboard?.writeText(data.shopping.join("\n"));
let cn=document.getElementById("copyNotes");if(cn)cn.onclick=()=>navigator.clipboard?.writeText(data.notes);
}
applyAesthetic();
Object.assign(document.documentElement.dataset, typography);
render();
document.addEventListener("visibilitychange", () => {
 if (!document.hidden) { refreshDailyAffirmation(); refreshDueReminders(); }
});
setInterval(() => { refreshDailyAffirmation(); refreshDueReminders(); if (section === "Home" || section === "Weather") refreshWeather(); }, 30000);
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
